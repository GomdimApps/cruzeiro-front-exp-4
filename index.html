<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ONG Exemplo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="pular" href="#conteudo">Pular para o conteúdo</a>
  <header>
    <h1>ONG Exemplo</h1>
    <nav aria-label="Navegação principal">
      <ul>
        <li><a href="#conteudo">Início</a></li>
        <li><a href="#titulo-voluntario">Voluntariado</a></li>
      </ul>
    </nav>
  </header>
  <main id="conteudo" tabindex="-1">
    <p>Bem-vindo(a) à página da ONG Exemplo.</p>
    <section aria-labelledby="titulo-voluntario">
      <h2 id="titulo-voluntario">Seja voluntário(a)</h2>
      <form action="#" method="post" aria-describedby="ajuda-form">
        <p id="ajuda-form">Os campos marcados com asterisco são obrigatórios.</p>
        <label for="nome">Nome completo *</label>
        <input type="text" id="nome" name="nome" autocomplete="name" required aria-required="true">
        <label for="email">E-mail *</label>
        <input type="email" id="email" name="email" autocomplete="email" required aria-required="true">
        <button type="submit">Enviar</button>
      </form>
    </section>
  </main>
  <footer>
    <p>&copy; 2026 ONG Exemplo. Todos os direitos reservados.</p>
  </footer>
</body>
</html>
